<mat-sidenav-container class="app-container" [class.auth-layout]="isAuthPage()">
  <mat-sidenav #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isAuthPage() && !isHandset()"
    class="app-sidenav"
    *ngIf="!isAuthPage()">
    <div class="sidenav-header">
      <mat-icon class="logo-icon">account_balance</mat-icon>
      <span class="app-name">FinTrack</span>
    </div>
    <mat-nav-list>
      <a mat-list-item
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active-link"
        (click)="isHandset() && sidenav.close()">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span matListItemTitle>{{item.label}}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" *ngIf="!isAuthPage()" class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isHandset()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
        <div class="user-avatar">{{getUserInitials()}}</div>
        <span class="user-name">{{currentUser()?.displayName || currentUser()?.email}}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="main-content" [class.with-toolbar]="!isAuthPage()">
      <router-outlet></router-outlet>
    </div>

    <footer class="app-footer" *ngIf="!isAuthPage()">
      <span>Built by Lokesh Bhusal</span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
