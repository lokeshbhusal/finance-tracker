<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-content>
      <div class="auth-header">
        <mat-icon class="auth-logo">account_balance</mat-icon>
        <h1>Finance Tracker</h1>
        <p class="subtitle">Sign in to manage your finances</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="login()" class="auth-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="you@example.com" autocomplete="email">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
            <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Password must be at least 6 characters</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width submit-btn" [disabled]="loading()">
          <mat-spinner diameter="20" *ngIf="loading()"></mat-spinner>
          <span *ngIf="!loading()">Sign In</span>
        </button>
      </form>

      <div class="divider-row">
        <mat-divider></mat-divider>
        <span class="divider-text">OR</span>
        <mat-divider></mat-divider>
      </div>

      <button mat-stroked-button class="full-width google-btn" (click)="googleSignIn()" [disabled]="loading()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18">
        Sign in with Google
      </button>

      <p class="register-link">
        Don't have an account? <a routerLink="/auth/register">Create one</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
