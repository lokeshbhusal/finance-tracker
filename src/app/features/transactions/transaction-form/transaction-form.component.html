<h2 mat-dialog-title>{{isEdit() ? 'Edit Transaction' : 'Add Transaction'}}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="transaction-form">

    <!-- Type -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        <mat-option value="income">
          <mat-icon style="color: #4caf50; vertical-align: middle; margin-right: 8px;">trending_up</mat-icon>
          Income
        </mat-option>
        <mat-option value="expense">
          <mat-icon style="color: #f44336; vertical-align: middle; margin-right: 8px;">trending_down</mat-icon>
          Expense
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('type')?.hasError('required')">Type is required</mat-error>
    </mat-form-field>

    <!-- Amount -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Amount</mat-label>
      <span matTextPrefix>$&nbsp;</span>
      <input matInput type="number" formControlName="amount" placeholder="0.00" min="0.01" step="0.01">
      <mat-error *ngIf="form.get('amount')?.hasError('required')">Amount is required</mat-error>
      <mat-error *ngIf="form.get('amount')?.hasError('min')">Amount must be greater than 0</mat-error>
    </mat-form-field>

    <!-- Category -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let cat of categories()" [value]="cat">{{cat}}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('category')?.hasError('required')">Category is required</mat-error>
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" placeholder="Brief description">
      <mat-error *ngIf="form.get('description')?.hasError('required')">Description is required</mat-error>
      <mat-error *ngIf="form.get('description')?.hasError('maxlength')">Max 100 characters</mat-error>
    </mat-form-field>

    <!-- Date -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="form.get('date')?.hasError('required')">Date is required</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || loading()">
    <mat-spinner diameter="18" *ngIf="loading()"></mat-spinner>
    <span *ngIf="!loading()">{{isEdit() ? 'Update' : 'Add'}}</span>
  </button>
</mat-dialog-actions>
